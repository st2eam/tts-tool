[package]
name = "tts-xiao-gongju"
version = "0.1.0"
edition = "2024"
description = "轻量级 Tabletop Simulator 图包导入工具"

[[bin]]
name = "TTS小工具"
path = "src/main.rs"

[dependencies]
dirs-next = "2.0"
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
rfd = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.20"
thiserror = "2.0"
unrar-rs = { version = "0.5.5", default-features = false, features = ["crypto-rust"] }
winreg = "0.55"
zip = { version = "2.4", default-features = false, features = ["deflate"] }

[build-dependencies]
embed-resource = "3.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = "symbols"
